<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Aura Energy Flame Trail -->
  <g opacity="0.9">
    <path d="M 125 35 C 165 15 180 45 165 72 C 190 88 175 125 155 138 C 170 160 142 180 120 168 C 132 145 128 115 120 95 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" />
