    <path d="M 172 65 C 184 58 190 72 180 84 C 175 78 172 72 172 65 Z" fill="#f59e0b" />
    <path d="M 155 132 C 168 140 162 154 148 152 C 150 144 152 138 155 132 Z" fill="#f59e0b" />
  </g>

  <!-- Mascot Body Line & Solid Fills -->
  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg (Back) -->
    <path d="M 68 135 L 45 165 C 40 172 48 180 58 178 L 84 150 Z" fill="#3f3f46" stroke-width="4" />
    <ellipse cx="49" cy="172" rx="9" ry="5" transform="rotate(-30 49 172)" fill="#27272a" stroke-width="3" />

    <!-- Right Leg -->
    <path d="M 108 135 L 132 165 C 138 172 130 180 120 178 L 95 150 Z" fill="#3f3f46" stroke-width="4" />
    <ellipse cx="128" cy="172" rx="9" ry="5" transform="rotate(30 128 172)" fill="#27272a" stroke-width="3" />

    <!-- Torso -->
    <path d="M 72 95 C 68 115 72 142 90 145 C 108 142 112 115 108 95 Z" fill="#3f3f46" stroke-width="4" />

    <!-- Left Arm / Punching Fist -->
    <path d="M 72 105 C 50 108 40 120 42 132 C 45 142 58 142 66 132 L 78 118 Z" fill="#3f3f46" stroke-width="4" />
    <ellipse cx="48" cy="128" rx="7" ry="6" fill="#27272a" stroke-width="3" />

    <!-- Right Arm / Gesture -->
    <path d="M 115 95 L 148 78 C 158 72 168 82 160 92 L 128 112 Z" fill="#3f3f46" stroke-width="4" />
    <circle cx="160" cy="78" r="5" fill="#27272a" stroke-width="3" />
    <circle cx="150" cy="72" r="4.5" fill="#27272a" stroke-width="3" />

    <!-- Left Ear -->
    <path d="M 52 58 C 38 35 40 12 60 8 C 76 5 82 25 88 52 Z" fill="#3f3f46" stroke-width="4" />
    <path d="M 60 22 C 68 20 74 32 78 48" stroke="#18181b" stroke-width="2.5" opacity="0.6" />

    <!-- Right Ear -->
    <path d="M 128 58 C 142 35 140 12 120 8 C 104 5 98 25 92 52 Z" fill="#3f3f46" stroke-width="4" />
    <path d="M 120 22 C 112 20 106 32 102 48" stroke="#18181b" stroke-width="2.5" opacity="0.6" />

    <!-- Head -->
    <path d="M 44 68 C 40 92 62 110 90 110 C 118 110 140 92 136 68 C 134 46 116 28 90 28 C 64 28 46 46 44 68 Z" fill="#3f3f46" stroke-width="4" />

    <!-- White Headband / Visor -->
    <path d="M 44 62 Q 90 54 136 62 L 135 78 Q 90 70 45 78 Z" fill="#ffffff" stroke-width="3.5" />

    <!-- Triangle Mouth -->
    <polygon points="85,86 95,86 90,93" fill="#ffffff" stroke-width="2" />
  </g>
</svg>
